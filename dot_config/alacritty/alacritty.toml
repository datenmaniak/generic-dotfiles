general.import = [ "~/.local/state/omarchy/current/theme/alacritty.toml" ]

[env]
TERM = "xterm-256color"

[terminal]
osc52 = "CopyPaste"

[font]
normal = { family = "UbuntuMono Nerd Font", style = "Regular"  }
#normal = { family = "UbuntuMono Nerd Font" }
bold = { family = "UbuntuMono Nerd Font", style = "Normal"  }
italic = { family = "UbuntuMono Nerd Font" , style = "Italic" }
#normal = { family = "UbuntuMono Nerd Font" }
#normal = { family = "UbuntuMono Nerd Font" }
#italic = { family = "UbuntuMono Nerd Font" }

size = 9

[window]
padding.x = 14
padding.y = 14
decorations = "None"

[keyboard]
bindings = [
{ key = "Insert", mods = "Shift", action = "Paste" },
{ key = "Insert", mods = "Control", action = "Copy" },
# Send Shift+Return as CSI-u so TUIs can distinguish it from Return without treating it as Alt+Return.
{ key = "Return", mods = "Shift", chars = "\u001B[13;2u" },
# Legacy encoding sends Alt+Shift+Return the same as Alt+Return; send CSI-u so tmux can match M-S-Enter.
{ key = "Return", mods = "Alt|Shift", chars = "\u001B[13;4u" },
# Pegar sin esfuerzo  
{ key = "V", mods = "Alt", action = "Paste" },
# Abrir nueva ventana
{ key = "N", mods = "Control|Shift",  action = "SpawnNewInstance"  }
]

# ------ 


[scrolling]
history = 100000
multiplier = 3

[selection]
save_to_clipboard = false

#shell = { program = "/usr/bin/tmux", args = ["new-session"] }
#shell = { program = "/usr/bin/tmux", args = ["new-session", "-A", "-s", "main"] }


